<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    input, select, button {
      margin: 5px 0;
      display: block;
      width: 300px;
      padding: 8px;
      box-sizing: border-box;
    }

    #listBoxClientes {
      height: 120px;
    }

    .botoes {
      margin-top: 10px;
    }

    .botoes button {
      display: inline-block;
      width: 145px;
      margin-right: 5px;
      cursor: pointer;
    }

    .mensagem {
      margin-top: 10px;
      font-weight: bold;
    }

    .sucesso {
      color: green;
    }

    .erro {
      color: red;
    }
  </style>
</head>

<body>

  <h2>Cadastro de Clientes</h2>

  <label for="listBoxClientes">Clientes:</label>
  <select id="listBoxClientes" size="5"></select>

  <button type="button" onclick="buscarCliente()">
    Buscar Cliente
  </button>

  <h3>Dados do Cliente</h3>

  <input
    type="text"
    id="txtNome"
    placeholder="Nome"
  >

  <input
    type="text"
    id="txtEndereco"
    placeholder="Endereço"
  >

  <input
    type="text"
    id="txtTelefone"
    placeholder="Telefone"
  >

  <input
    type="email"
    id="txtEmail"
    placeholder="Email"
  >

  <div class="botoes">
    <button type="button" onclick="incluirCliente()">
      Incluir Cliente
    </button>

    <button type="button" onclick="alterarCliente()">
      Alterar Cliente
    </button>
  </div>

  <div id="mensagem" class="mensagem"></div>

  <script>
    // Dados iniciais usados apenas se ainda não existir
    // nenhum cadastro no localStorage.
    const clientesIniciais = [
      {
        id: 1,
        nome: "João Silva",
        endereco: "Rua A",
        telefone: "123456",
        email: "joao@gmail.com"
      },
      {
        id: 2,
        nome: "Maria Oliveira",
        endereco: "Rua B",
        telefone: "654321",
        email: "maria@gmail.com"
      }
    ];

    // Recupera os clientes do localStorage.
    // Se não existir nenhum, cria os dados iniciais.
    let clientes = JSON.parse(localStorage.getItem("clientes"));

    if (!Array.isArray(clientes)) {
      clientes = clientesIniciais;
      salvarLocalStorage();
    }

    const listBox = document.getElementById("listBoxClientes");
    const txtNome = document.getElementById("txtNome");
    const txtEndereco = document.getElementById("txtEndereco");
    const txtTelefone = document.getElementById("txtTelefone");
    const txtEmail = document.getElementById("txtEmail");
    const mensagem = document.getElementById("mensagem");


    // --------------------------------------------------
    // Salva o array de clientes no localStorage
    // --------------------------------------------------
    function salvarLocalStorage() {
      localStorage.setItem("clientes", JSON.stringify(clientes));
    }


    // --------------------------------------------------
    // Atualiza a lista de clientes na tela
    // --------------------------------------------------
    function atualizarLista() {
      // Limpa a lista atual
      listBox.innerHTML = "";

      // Adiciona novamente todos os clientes
      clientes.forEach(cliente => {
        const option = document.createElement("option");

        option.value = cliente.id;
        option.textContent = `${cliente.id} - ${cliente.nome}`;

        listBox.appendChild(option);
      });
    }


    // --------------------------------------------------
    // Mostra uma mensagem para o usuário
    // --------------------------------------------------
    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = "mensagem " + tipo;

      // Remove a mensagem depois de 3 segundos
      setTimeout(() => {
        mensagem.textContent = "";
        mensagem.className = "mensagem";
      }, 3000);
    }


    // --------------------------------------------------
    // Valida os campos do formulário
    // --------------------------------------------------
    function validarCampos() {
      const nome = txtNome.value.trim();
      const endereco = txtEndereco.value.trim();
      const telefone = txtTelefone.value.trim();
      const email = txtEmail.value.trim();

      if (!nome || !endereco || !telefone || !email) {
        mostrarMensagem(
          "Preencha todos os campos antes de salvar.",
          "erro"
        );

        return false;
      }

      return true;
    }


    // --------------------------------------------------
    // Obtém os dados digitados no formulário
    // --------------------------------------------------
    function obterDadosFormulario() {
      return {
        nome: txtNome.value.trim(),
        endereco: txtEndereco.value.trim(),
        telefone: txtTelefone.value.trim(),
        email: txtEmail.value.trim()
      };
    }


    // --------------------------------------------------
    // Inclui um novo cliente
    // --------------------------------------------------
    function incluirCliente() {

      // Validação
      if (!validarCampos()) {
        return;
      }

      // Gera um ID único.
      // Pega o maior ID existente e soma 1.
      let novoId = 1;

      if (clientes.length > 0) {
        novoId = Math.max(...clientes.map(cliente => cliente.id)) + 1;
      }

      // Obtém os dados do formulário
      const dados = obterDadosFormulario();

      // Cria o novo cliente
      const novoCliente = {
        id: novoId,
        nome: dados.nome,
        endereco: dados.endereco,
        telefone: dados.telefone,
        email: dados.email
      };

      // Adiciona ao array
      clientes.push(novoCliente);

      // Salva no localStorage
      salvarLocalStorage();

      // Atualiza a lista na tela
      atualizarLista();

      // Seleciona automaticamente o novo cliente
      listBox.value = novoId;

      mostrarMensagem(
        "Cliente incluído com sucesso!",
        "sucesso"
      );

      // Limpa o formulário
      limparFormulario();
    }


    // --------------------------------------------------
    // Altera o cliente selecionado
    // --------------------------------------------------
    function alterarCliente() {

      // Verifica se existe um cliente selecionado
      if (!listBox.value) {
        mostrarMensagem(
          "Selecione um cliente para alterar.",
          "erro"
        );

        return;
      }

      // Validação dos campos
      if (!validarCampos()) {
        return;
      }

      const idSelecionado = Number(listBox.value);

      // Localiza o cliente
      const indice = clientes.findIndex(
        cliente => cliente.id === idSelecionado
      );

      if (indice === -1) {
        mostrarMensagem(
          "Cliente não encontrado.",
          "erro"
        );

        return;
      }

      // Obtém os novos dados
      const dados = obterDadosFormulario();

      // Mantém o mesmo ID e atualiza os dados
      clientes[indice] = {
        id: idSelecionado,
        nome: dados.nome,
        endereco: dados.endereco,
        telefone: dados.telefone,
        email: dados.email
      };

      // Salva as alterações
      salvarLocalStorage();

      // Atualiza automaticamente a lista
      atualizarLista();

      // Mantém o cliente alterado selecionado
      listBox.value = idSelecionado;

      mostrarMensagem(
        "Cliente alterado com sucesso!",
        "sucesso"
      );
    }


    // --------------------------------------------------
    // Busca o cliente selecionado
    // --------------------------------------------------
    function buscarCliente() {

      if (!listBox.value) {
        mostrarMensagem(
          "Selecione um cliente na lista.",
          "erro"
        );

        return;
      }

      const selectedId = Number(listBox.value);

      const cliente = clientes.find(
        cliente => cliente.id === selectedId
      );

      if (cliente) {
        txtNome.value = cliente.nome;
        txtEndereco.value = cliente.endereco;
        txtTelefone.value = cliente.telefone;
        txtEmail.value = cliente.email;
      }
    }


    // --------------------------------------------------
    // Limpa o formulário
    // --------------------------------------------------
    function limparFormulario() {
      txtNome.value = "";
      txtEndereco.value = "";
      txtTelefone.value = "";
      txtEmail.value = "";
    }


    // --------------------------------------------------
    // Inicialização
    // --------------------------------------------------
    atualizarLista();

  </script>

</body>
</html>
